<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de resultados · 302 digital</title>
<style>
  :root { --ink: #202123; --paper: #F8FAF5; --muted: #5E5F63; --accent: #CF7729; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--paper); color: var(--ink);
    font-family: "Century Gothic", "Avenir Next", Poppins, ui-sans-serif, system-ui, sans-serif;
  }
  main { max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 140px; height: auto; }
  h1 { margin: 8px 0 0; font-size: 24px; font-weight: 600; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  .bar { width: 48px; height: 4px; border-radius: 999px; background: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="/logo-302.png" alt="302 digital">
  <span class="bar" aria-hidden="true"></span>
  <h1>Portal de resultados</h1>
  <p>Em breve, seus resultados de Meta Ads e Google Ads em tempo real, neste endereço.</p>
</main>
</body>
</html>
